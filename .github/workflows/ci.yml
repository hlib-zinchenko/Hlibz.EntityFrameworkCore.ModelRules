name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One SDK per target framework: each TFM builds and tests against its own EF Core major
      # (8, 9, 10), and the tests need that runtime to run.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --project tests/Hlibz.EntityFrameworkCore.ModelRules.Tests --no-build --configuration Release
